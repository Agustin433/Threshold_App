name: PDF Charts Check

# Emula Streamlit Community Cloud: contenedor Debian, paquetes de sistema
# desde packages.txt y dependencias desde el lockfile. Genera los tres PDF
# (profesional, atleta, cliente) y verifica con pdfimages que cada uno traiga
# sus graficos como IMAGENES (kaleido + Chromium del sistema), no solo con el
# respaldo dibujado a mano.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pdf-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: python:3.14-slim-bookworm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system packages (packages.txt, como Streamlit Cloud)
        run: |
          apt-get update
          xargs -a packages.txt apt-get install -y
          apt-get install -y poppler-utils

      - name: Install Python dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the three PDFs and check chart images
        run: python scripts/check_pdf_charts.py pdf-check

      - name: List images with pdfimages
        if: always()
        run: |
          for f in pdf-check/*.pdf; do echo "== $f"; pdfimages -list "$f"; done

      - name: Upload PDFs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-charts-check
          path: pdf-check/*.pdf
          if-no-files-found: ignore
