# Usar la service_role key, no la anon/publishable key: las tablas de
# evaluations y dataset_rows tienen Row Level Security habilitado sin
# politicas para anon/authenticated (ver supabase_evaluations_schema.sql
# y supabase_dataset_store_schema.sql), asi que con anon key la app no
# va a poder leer ni escribir nada. La service_role key vive solo en este
# archivo, nunca en el navegador (la app corre server-side en Streamlit).
SUPABASE_URL = "https://your-project-id.supabase.co"
SUPABASE_KEY = "your-service-role-key"
SUPABASE_EVALUATIONS_TABLE = "evaluations"
SUPABASE_DATASETS_TABLE = "dataset_rows"
