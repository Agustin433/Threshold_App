# Usar la service_role key, no la anon/publishable key: las tablas de
# evaluations y dataset_rows tienen Row Level Security habilitado sin
# politicas para anon/authenticated (ver supabase/migrations/), asi que con anon key la app no
# va a poder leer ni escribir nada. La service_role key vive solo en este
# archivo, nunca en el navegador (la app corre server-side en Streamlit).
SUPABASE_URL = "https://your-project-id.supabase.co"
SUPABASE_KEY = "your-service-role-key"
SUPABASE_EVALUATIONS_TABLE = "evaluations"
SUPABASE_DATASETS_TABLE = "dataset_rows"

# ── Importar perfiles desde el Google Form (pagina "Importar perfiles") ──
# Opcional. Sin esto, la pagina acepta el CSV exportado a mano.
# La planilla se comparte SOLO con el client_email de la service account, en
# modo lector. Nunca "Publicar en la web": tiene telefonos y datos de salud.
PROFILE_FORM_SPREADSHEET_ID = "id-de-la-planilla-de-respuestas"
PROFILE_FORM_WORKSHEET = "Respuestas de formulario 1"

[gcp_service_account]
type = "service_account"
project_id = "tu-proyecto"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "threshold-forms@tu-proyecto.iam.gserviceaccount.com"
client_id = "..."
token_uri = "https://oauth2.googleapis.com/token"
