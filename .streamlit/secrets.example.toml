# Usar la service_role key, no la anon/publishable key: las tablas de
# evaluations y dataset_rows tienen Row Level Security habilitado sin
# politicas para anon/authenticated (ver supabase_evaluations_schema.sql
# y supabase_dataset_store_schema.sql), asi que con anon key la app no
# va a poder leer ni escribir nada. La service_role key vive solo en este
# archivo, nunca en el navegador (la app corre server-side en Streamlit).
SUPABASE_URL = "https://your-project-id.supabase.co"
SUPABASE_KEY = "your-service-role-key"
SUPABASE_EVALUATIONS_TABLE = "evaluations"
SUPABASE_DATASETS_TABLE = "dataset_rows"

# Login (OIDC). Como la service_role key ignora RLS, el login es lo unico que
# separa los datos de los atletas de cualquiera que tenga la URL de la app.
# Solo entran los emails de esta lista (sin distinguir mayusculas).
ALLOWED_EMAILS = ["tu-email@gmail.com"]

# Solo para desarrollo local en tu propia maquina. Nunca en una app publicada.
# THRESHOLD_AUTH_DISABLED = true

# Las claves sueltas de arriba tienen que ir antes de esta seccion: en TOML,
# todo lo que viene despues de [auth] pertenece a [auth].
[auth]
# URL de la app + /oauth2callback. Local: http://localhost:8501/oauth2callback
# Publicada: https://<tu-app>/oauth2callback. Debe estar registrada tal cual
# en el cliente OAuth de Google Cloud ("Authorized redirect URIs").
redirect_uri = "http://localhost:8501/oauth2callback"
# Generar con: python -c "import secrets; print(secrets.token_urlsafe(32))"
cookie_secret = "random-string-largo"
client_id = "xxxx.apps.googleusercontent.com"
client_secret = "xxxx"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
